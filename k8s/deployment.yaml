apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: todo-app
  labels:
    app: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: todo-app
          image: todo-django-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: mariadb
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom: {secretKeyRef: {name: todo-secrets, key: DB_NAME}}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: todo-secrets, key: DB_USER}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: todo-secrets, key: DB_PASSWORD}}
            - name: DJANGO_SECRET_KEY
              valueFrom: {secretKeyRef: {name: todo-secrets, key: DJANGO_SECRET_KEY}}
            - name: GUNICORN_WORKERS
              value: "3"
            - name: GUNICORN_THREADS
              value: "2"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet: {path: /health/, port: 3000}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health/, port: 3000}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/, port: 3000}
            periodSeconds: 10
            failureThreshold: 3
