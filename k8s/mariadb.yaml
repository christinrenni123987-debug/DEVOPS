apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data
  namespace: todo-app
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: todo-app
  labels:
    app: mariadb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4
          ports:
            - containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              valueFrom: {secretKeyRef: {name: todo-secrets, key: DB_NAME}}
            - name: MARIADB_USER
              valueFrom: {secretKeyRef: {name: todo-secrets, key: DB_USER}}
            - name: MARIADB_PASSWORD
              valueFrom: {secretKeyRef: {name: todo-secrets, key: DB_PASSWORD}}
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: todo-secrets, key: DB_ROOT_PASSWORD}}
          readinessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -h 127.0.0.1 -uroot -p$MARIADB_ROOT_PASSWORD"]
            initialDelaySeconds: 15
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mariadb-data
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: todo-app
spec:
  selector:
    app: mariadb
  ports:
    - port: 3306
      targetPort: 3306
